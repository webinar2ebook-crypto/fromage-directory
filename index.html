<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Fromage Directory — Essential World Cheeses</title>
    <meta name="description" content="A clean, simple practice directory website featuring three world-famous cheeses with origin details and tasting profiles." />
    <meta property="og:title" content="The Fromage Directory — Essential World Cheeses" />
    <meta property="og:description" content="A clean, simple practice directory website featuring three world-famous cheeses with origin details and tasting profiles." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      // In AI Studio iFrame preview, HMR WebSocket is disabled. Ignore WebSocket connection errors.
      window.addEventListener('unhandledrejection', function (event) {
        if (
          event.reason &&
          (String(event.reason).includes('WebSocket') ||
            (event.reason.message && event.reason.message.includes('WebSocket')) ||
            (event.reason.stack && event.reason.stack.includes('WebSocket')))
        ) {
          event.preventDefault();
          event.stopPropagation();
        }
      });
      window.addEventListener('error', function (event) {
        if (
          event.message &&
          (event.message.includes('WebSocket') || event.message.includes('@vite/client'))
        ) {
          event.preventDefault();
          event.stopPropagation();
        }
      }, true);
    </script>
  </head>
  <body class="bg-stone-50 text-stone-800 antialiased selection:bg-amber-100 selection:text-amber-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
